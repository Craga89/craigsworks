name: Store a build on the pages branch
description: >-
  The `pages` branch holds everything GitHub Pages serves: the live site at the root and a staging
  preview of each branch under staging/<branch>/. This puts a build in its place on that branch (or
  removes a preview), rewrites staging/index.html, and pushes. pages-deploy.yml then publishes the
  branch. Concurrent runs retry until their push lands, so no update is lost. Needs the repository
  checked out (for tools/) and contents: write.
inputs:
  target:
    description: "Where the build goes: '' for the live site, or 'staging/<slug>'"
    default: ''
  source:
    description: The built site (its .html files get the commit stamped in). Blank with remove.
    default: ''
  remove:
    description: "'true' to delete the target instead (a deleted branch's preview)"
    default: 'false'
  branch:
    description: The branch the build is from (recorded with a staging preview)
    default: ''
  sha:
    description: The commit the build is from
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SOURCE: ${{ inputs.source }}
        REMOVE: ${{ inputs.remove }}
        BRANCH: ${{ inputs.branch }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        case "$TARGET" in ''|staging/[a-z0-9]*) ;; *) echo "::error::bad target '$TARGET'"; exit 1;; esac
        case "$TARGET" in *..*|*/*/*) echo "::error::bad target '$TARGET'"; exit 1;; esac
        export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
        export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
        export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

        # The pages carry the commit they were built from (data-commit, data-built), which the
        # Lighthouse workflow uses to know an address is serving this site.
        if [ "$REMOVE" != true ]; then
          at="$(git log -1 --format=%cI "$SHA" 2>/dev/null || date -u +%FT%TZ)"
          find "$SOURCE" -name '*.html' -exec sed -i "s/__BUILD_SHA__/${SHA}/g; s/__BUILD_AT__/${at}/g" {} +
        fi
        message="$(git log -1 --format=%s "$SHA" 2>/dev/null || true)"
        repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        tree="$RUNNER_TEMP/pages-tree"

        for attempt in 1 2 3 4 5 6; do
          rm -rf "$tree"; mkdir -p "$tree"
          # The current branch (one commit, no history), or nothing on the very first run.
          lease=""
          if git fetch -q --depth=1 origin "+refs/heads/pages:refs/remotes/origin/pages" 2>/dev/null; then
            lease="$(git rev-parse refs/remotes/origin/pages)"
            git archive "$lease" | tar -x -C "$tree"
          fi

          if [ -z "$TARGET" ]; then
            # The live site: everything at the root except staging/ is replaced.
            find "$tree" -mindepth 1 -maxdepth 1 ! -name staging -exec rm -rf {} +
            cp -a "$SOURCE"/. "$tree"/
          else
            rm -rf "${tree:?}/$TARGET"
            if [ "$REMOVE" != true ]; then
              mkdir -p "$tree/$TARGET" && cp -a "$SOURCE"/. "$tree/$TARGET"/
              node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ branch: process.argv[2], sha: process.argv[3], at: new Date().toISOString(), message: process.argv[4] }, null, 2))' \
                "$tree/$TARGET/_staging.json" "$BRANCH" "$SHA" "$message"
            fi
          fi
          node tools/staging-index.mjs index "$tree" "$repo_url"

          # Commit the tree with a separate index, so the checkout is untouched.
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages-index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree "$tree" add -A -f .
          what="${TARGET:-live site}"; [ "$REMOVE" = true ] && what="remove $TARGET"
          commit="$(git commit-tree "$(git write-tree)" -m "Pages: $what from ${SHA:0:7}")"
          unset GIT_INDEX_FILE
          # Replace the branch only if nobody else has since (the lease), otherwise start again.
          if git push -q --force-with-lease="refs/heads/pages:${lease}" origin "$commit:refs/heads/pages"; then
            echo "::notice title=Pages branch::$what from ${SHA:0:7}"
            exit 0
          fi
          echo "Someone else updated the pages branch; trying again ($attempt)"
          sleep $((attempt * 3))
        done
        echo "::error::Couldn't update the pages branch"; exit 1
