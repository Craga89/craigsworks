# Throwaway: a dependency audit report, committed back to this branch.
name: Bootstrap dependencies, fonts and formatting
on:
  push:
    branches: ['bootstrap/**']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Lighthouse 13 trial
        run: |
          mkdir -p audit/lh out "$RUNNER_TEMP/lighthouse" && cd "$RUNNER_TEMP/lighthouse"
          echo '{"private":true}' > package.json
          pnpm add lighthouse@13 --config.strict-dep-builds=false > /dev/null
          cd "$GITHUB_WORKSPACE"
          L="$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse"
          { node --version; "$L" --version; } > audit/lh/versions.txt
          for preset in mobile desktop; do
            flags=""; [ "$preset" = desktop ] && flags="--preset=desktop"
            "$L" https://craga89.github.io/craigsworks/ $flags --quiet --output=json --output-path="out/$preset-1.json" \
              --chrome-flags="--headless=new --no-sandbox" 2> "audit/lh/$preset.log" || echo "run failed" >> "audit/lh/$preset.log"
          done
          ls -la out
          node tools/lighthouse-summary.mjs out > audit/lh/summary.json 2> audit/lh/summary.err || echo "summary exit $?" >> audit/lh/summary.err
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audit/lh .node-version
          git commit -qm "chore: lighthouse 13 trial (throwaway)" && git push origin "HEAD:$GITHUB_REF_NAME"
