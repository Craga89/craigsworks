# Throwaway: a dependency audit report, committed back to this branch.
name: Bootstrap dependencies, fonts and formatting
on:
  push:
    branches: ['bootstrap/**']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit
          pnpm install --frozen-lockfile
          node audit/report.mjs || echo "report failed" > audit/report.err
          pnpm outdated --long > audit/outdated.txt 2>&1 || true
          pnpm audit > audit/audit.txt 2>&1 || true
          pnpm audit --json > audit/audit.json 2>&1 || true
          pnpm list --depth Infinity --json > audit/tree.json 2>&1 || true
          curl -fsSL https://nodejs.org/dist/index.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.slice(0,40).map(r=>[r.version,r.date,r.lts||"-",r.security?"security":""].join(" ")).join("\n"))})' > audit/node.txt
          curl -fsSL https://raw.githubusercontent.com/nodejs/Release/main/schedule.json > audit/node-schedule.json || true
          for r in actions/checkout actions/setup-node actions/cache actions/upload-artifact actions/download-artifact actions/configure-pages actions/upload-pages-artifact actions/deploy-pages pnpm/action-setup lycheeverse/lychee-action; do
            gh api "repos/$r/releases?per_page=6" --jq '.[] | select(.prerelease==false and .draft==false) | "\(.tag_name) \(.published_at[0:10])"' | while read -r tag date; do
              sha=$(gh api "repos/$r/commits/$tag" --jq .sha)
              echo "$r $tag $date $sha"
            done
          done > audit/actions.txt 2>&1 || true
          gh api repos/lycheeverse/lychee/releases?per_page=4 --jq '.[] | "lychee \(.tag_name) \(.published_at[0:10])"' >> audit/actions.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f audit
          git commit -qm "chore: dependency audit report (throwaway)" && git push origin "HEAD:$GITHUB_REF_NAME"
