# Writes pnpm-lock.yaml, downloads the self-hosted fonts, formats the code with oxfmt and
# applies oxlint's safe fixes.
#   Push a `bootstrap/…` branch: installs from pnpm-lock.yaml (or, without one, the versions in
#   package.json), and commits the result back to that branch.
#   Run by hand with "latest": upgrades every dev dependency to its latest version, and pushes the
#   result to the `bootstrap` branch for review.
name: Bootstrap dependencies, fonts and formatting

on:
  workflow_dispatch:
    inputs:
      latest:
        description: Upgrade the dev dependencies to their latest versions
        type: boolean
        default: true
  push:
    branches: ['bootstrap/**']

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the latest versions
        if: github.event_name == 'workflow_dispatch' && inputs.latest
        run: |
          rm -f pnpm-lock.yaml
          # Exact versions in package.json; pnpm-lock.yaml pins the rest.
          pnpm add --save-exact --save-dev --config.strict-dep-builds=false \
            @axe-core/playwright@latest @playwright/test@latest playwright@latest \
            @types/node@22 axe-core@latest oxfmt@latest oxlint@latest typescript@6 \
            astro@latest @astrojs/sitemap@latest @astrojs/check@latest
      - name: Install the locked versions
        if: github.event_name == 'push' || !inputs.latest
        run: |
          # Without a lockfile, write one; dependencies with unreviewed install scripts are listed in
          # pnpm-workspace.yaml (allowBuilds) to review, rather than failing the run.
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --config.strict-dep-builds=false; fi
      - name: Fonts
        run: node tools/fetch-fonts.mjs
      - name: Format and fix
        run: |
          pnpm exec oxfmt --version && pnpm exec oxfmt .
          pnpm exec oxlint --fix || true
          pnpm exec oxlint > oxlint.txt 2>&1 || true
          tail -80 oxlint.txt
          git add -f oxlint.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Lockfile, fonts, formatting and lint fixes (bootstrap workflow)" || { echo "Nothing changed"; exit 0; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then git push origin "HEAD:$GITHUB_REF_NAME"; else git push -f origin HEAD:bootstrap; fi
