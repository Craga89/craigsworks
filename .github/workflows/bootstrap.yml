# Throwaway: runs the type check and every test, and commits the output back to this branch.
name: Bootstrap dependencies, fonts and formatting
on:
  push:
    branches: ['bootstrap/**']
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: Craga89/standards/github/actions/setup-playwright@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - name: Run
        run: |
          mkdir -p out
          pnpm run typecheck > out/typecheck.txt 2>&1 || true
          pnpm run build > out/build.txt 2>&1 || true
          CI=1 pnpm exec playwright test --project=desktop --project=mobile --reporter=line > out/e2e.txt 2>&1 || true
          CI=1 pnpm exec playwright test --project=a11y-desktop --project=a11y-mobile --reporter=line > out/a11y.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out && git commit -qm "chore: debug output (throwaway)" && git push origin "HEAD:$GITHUB_REF_NAME"
