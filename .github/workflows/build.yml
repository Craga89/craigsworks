# Builds the site (Astro; see astro.config.mjs) and uploads site/ as the "build" artifact.
# Called by the CI and link-check workflows.
#
# The site is built for wherever GitHub Pages serves it, read from the Pages settings: under
# /craigsworks/ on craga89.github.io until the custom domain is set, then at the root of
# craigsworks.com. The `base` output tells the tests which path to serve it at. Branch previews are
# built by Craga89/standards' preview workflow instead (see preview.yml).
name: Build

on:
  workflow_call:
    inputs:
      base:
        description: Build for this path instead of the one Pages serves from (e.g. '/' for the link check)
        type: string
        default: ''
    outputs:
      base:
        description: The path the site was built for
        value: ${{ jobs.build.outputs.base }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      base: ${{ steps.where.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/setup-node@2683e4116e18f128c46fce9261c4bd5d1284e8ff # v1
      - name: Where Pages serves the site
        id: pages
        if: inputs.base == ''
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Base path and origin
        id: where
        env:
          INPUT_BASE: ${{ inputs.base }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          base="${INPUT_BASE:-${PAGES_BASE:-/}}"
          base="/${base#/}"; base="${base%/}/"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "SITE_BASE=$base" >> "$GITHUB_ENV"
          # Pages reports http:// until HTTPS is enforced; the site is always served over https.
          origin="${PAGES_ORIGIN:-https://craigsworks.com}"; origin="https://${origin#*://}"
          echo "SITE_ORIGIN=$origin" >> "$GITHUB_ENV"
          echo "::notice title=Build::for $origin$base"
      - name: Build
        run: pnpm run build
        env:
          # The site stays out of search engines until this is true (and previews always do).
          ALLOW_INDEXING: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
