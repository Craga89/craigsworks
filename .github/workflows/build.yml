# Builds the site (Astro; see astro.config.mjs) and uploads site/ as the "build" artifact.
# Called by the CI and link-check workflows.
#
# The site is built for wherever GitHub Pages serves it, read from the Pages settings: under
# /craigsworks/ on craga89.github.io until the custom domain is set, then at the root of
# craigsworks.com. The `base` output tells the tests which path to serve it at.
name: Build

on:
  workflow_call:
    inputs:
      base:
        description: Build for this path instead of the one Pages serves from (e.g. '/' for the link check)
        type: string
        default: ''
    outputs:
      base:
        description: The path the site was built for
        value: ${{ jobs.build.outputs.base }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      base: ${{ steps.where.outputs.base }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/setup-node
      - name: Where Pages serves the site
        id: pages
        if: inputs.base == ''
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Base path and origin
        id: where
        env:
          INPUT_BASE: ${{ inputs.base }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          base="${INPUT_BASE:-${PAGES_BASE:-/}}"
          base="/${base#/}"; base="${base%/}/"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "SITE_BASE=$base" >> "$GITHUB_ENV"
          echo "SITE_ORIGIN=${PAGES_ORIGIN:-https://craigsworks.com}" >> "$GITHUB_ENV"
          echo "::notice title=Build::for ${PAGES_ORIGIN:-https://craigsworks.com}$base"
      - name: Build
        run: npm run build
        env:
          # The site stays out of search engines until this is true.
          ALLOW_INDEXING: 'false'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
