# Builds the site (Astro; see astro.config.mjs) and uploads site/ as the "build" artifact.
# Called by the CI and link-check workflows.
#
# The site is built for the root of craigsworks.com, as the Cloudflare Worker serves it
# (cloudflare/wrangler.jsonc). The `base` output tells the tests which path to serve it at. Branch
# previews are built by Craga89/standards' Cloudflare preview workflow instead (see preview.yml).
name: Build

on:
  workflow_call:
    inputs:
      base:
        description: Build for this path instead of the root
        type: string
        default: /
    outputs:
      base:
        description: The path the site was built for
        value: ${{ jobs.build.outputs.base }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      base: ${{ steps.where.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - name: Base path
        id: where
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          base="/${INPUT_BASE#/}"; base="${base%/}/"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "SITE_BASE=$base" >> "$GITHUB_ENV"
      - name: Build
        run: pnpm run build
        env:
          # The site stays out of search engines until this is true (and previews always do).
          ALLOW_INDEXING: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
