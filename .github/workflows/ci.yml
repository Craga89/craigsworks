# Every change: quality checks, a build, then the tests on that build. On the default branch, when
# everything passes, the build becomes the live site: it's stored at the root of the pages branch
# (next to the staging previews, see staging.yml) and the branch is deployed to GitHub Pages
# (pages-deploy.yml), then lighthouse.yml audits it.
#
#   lint ────────────┐
#   build ─┬─ unit ──┼─ publish ─ deploy (Pages) ─→ Lighthouse
#          ├─ e2e ───┤
#          └─ a11y ──┘
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deploys happen from the default branch only, never from pull requests.
  DEPLOY: ${{ github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run lint
      - run: npm run format:check

  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pages: read # where Pages serves the site from, so it's built for that path

  unit:
    name: Types and unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run typecheck
      - run: npm run test:unit

  e2e:
    name: End-to-end (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ needs.build.outputs.base }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: site
      - run: npx playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14

  a11y:
    name: WCAG 2.2 AA (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ needs.build.outputs.base }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: site
      - run: npx playwright test --project=a11y-desktop --project=a11y-mobile --shard=${{ matrix.shard }}/2 --reporter=blob
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  a11y-report:
    name: WCAG 2.2 AA report
    needs: a11y
    if: always() && needs.a11y.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: a11y-blob-*
          path: blob-report
          merge-multiple: true
      - name: Merge the shards
        run: npx playwright merge-reports --reporter=github,html,./tests/reporters/a11y-report.mjs blob-report
      - name: Summary
        run: |
          node -e '
            const r = require("./a11y.json");
            const lines = [`## WCAG 2.2 AA: ${r.pass ? "pass" : "FAIL"}`, "", `${r.tests} tests, ${r.axeRuns} axe runs (axe ${r.axe})`, ""];
            for (const v of r.violations) lines.push(`- **${v.rule}** (${v.impact}): ${v.help}. \`${v.target}\`, in ${v.states.slice(0, 3).join("; ")}`);
            for (const f of r.failures) lines.push(`- **${f.check}** (${f.state}): ${f.what}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            a11y.json
            playwright-report
          retention-days: 14
      - name: Save to the accessibility branch
        if: env.DEPLOY == 'true'
        run: |
          mkdir -p out/reports && cp a11y.json out/reports/latest.json
          echo "$GITHUB_SHA" > out/reports/commit.txt
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > out/reports/run.txt
          date -u +%FT%TZ > out/reports/at.txt
      - if: env.DEPLOY == 'true'
        uses: ./.github/actions/publish-branch
        with:
          branch: accessibility
          source: out
          message: WCAG 2.2 AA report for ${{ github.sha }}

  publish:
    name: Store the live site
    needs: [lint, unit, e2e, a11y]
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: site
      # The root of the pages branch; the staging previews under staging/ are kept.
      - uses: ./.github/actions/pages-store
        with:
          source: site
          sha: ${{ github.sha }}

  deploy:
    needs: publish
    uses: ./.github/workflows/pages-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
