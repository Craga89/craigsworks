# Every change: quality checks, a build, then the tests on that build. On the default branch, when
# everything passes, the build becomes the live site: it's deployed to the craigsworks Cloudflare
# Worker (cloudflare/wrangler.jsonc, Craga89/standards' cloudflare-deploy), then lighthouse.yml
# audits it. Branch previews: preview.yml. The actions come from Craga89/standards; the job names
# are the ruleset's required checks, so keep them.
#
#   lint ────────────┐
#   build ─┬─ unit ──┼─ deploy (Cloudflare) ─→ Lighthouse
#          ├─ e2e ───┤
#          └─ a11y ──┘
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Deploys happen from the default branch only, never from pull requests.
  DEPLOY: ${{ github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - run: pnpm run lint
      - run: pnpm run format:check

  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  unit:
    name: Types and unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - run: pnpm run typecheck
      - run: pnpm run test:unit

  e2e:
    name: End-to-end (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ needs.build.outputs.base }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: Craga89/standards/github/actions/setup-playwright@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: site
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14

  a11y:
    name: WCAG 2.2 AA (${{ matrix.shard }}/2)
    needs: build
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ needs.build.outputs.base }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: Craga89/standards/github/actions/setup-playwright@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: site
      - run: pnpm exec playwright test --project=a11y-desktop --project=a11y-mobile --shard=${{ matrix.shard }}/2 --reporter=blob
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  a11y-report:
    name: WCAG 2.2 AA report
    needs: a11y
    if: always() && needs.a11y.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: a11y-blob-*
          path: blob-report
          merge-multiple: true
      - name: Merge the shards
        run: pnpm exec playwright merge-reports --reporter=github,html,./tests/reporters/a11y-report.mjs blob-report
      - name: Summary
        run: |
          node -e '
            const r = require("./a11y.json");
            const lines = [`## WCAG 2.2 AA: ${r.pass ? "pass" : "FAIL"}`, "", `${r.tests} tests, ${r.axeRuns} axe runs (axe ${r.axe})`, ""];
            for (const v of r.violations) lines.push(`- **${v.rule}** (${v.impact}): ${v.help}. \`${v.target}\`, in ${v.states.slice(0, 3).join("; ")}`);
            for (const f of r.failures) lines.push(`- **${f.check}** (${f.state}): ${f.what}`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: |
            a11y.json
            playwright-report
          retention-days: 14
      - name: Save to the accessibility branch
        if: env.DEPLOY == 'true'
        run: mkdir -p out/reports && cp a11y.json out/reports/latest.json
      - if: env.DEPLOY == 'true'
        uses: Craga89/standards/github/actions/report-meta@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          dir: out/reports
      - if: env.DEPLOY == 'true'
        uses: Craga89/standards/github/actions/publish-branch@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
        with:
          branch: accessibility
          source: out
          message: WCAG 2.2 AA report for ${{ github.sha }}

  # The live site: once every check passes on the default branch, the build is stamped with its
  # commit and deployed to the craigsworks Worker, then checked. Nothing from a branch runs here, and
  # the Cloudflare token is only given to the deploy step (wrangler), never to the build or tests.
  deploy:
    name: Deploy to Cloudflare
    needs: [lint, unit, e2e, a11y]
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: site
      # The commit the site was built from, in the pages (what Lighthouse and the check look for).
      - name: Stamp the commit
        run: |
          at="$(git log -1 --format=%cI "$GITHUB_SHA")"
          find site -name '*.html' -exec sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g; s/__BUILD_SHORT__/${GITHUB_SHA:0:7}/g; s/__BUILD_AT__/${at}/g" {} +
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - name: Deploy to Cloudflare
        id: cloudflare
        uses: Craga89/standards/github/actions/cloudflare-deploy@ab3025a46168d28c3fe442b0ecf3ea22d39d1107 # v1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          config: cloudflare/wrangler.jsonc
          headers: cloudflare/_headers
      - name: Check it serves the site
        env:
          URL: ${{ steps.cloudflare.outputs.url }}
        run: tools/cloudflare-check.sh "$URL" live
