# Runs Lighthouse (mobile and desktop) against the live site and saves a summary to the
# `lighthouse` branch (reports/summary.json + full reports), so results can be read back later.
#
# After a deploy it runs when either CI or Staging deploy finishes, because either can be the one
# that publishes a new live site (a staging deploy can replace CI's waiting one, and publishes the
# live site CI stored). It audits only when the live site has changed since the last audit.
name: Lighthouse audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Page to audit (blank = the first address that's serving this site)
        default: ''
  workflow_run:
    workflows: [CI, Staging deploy]
    types: [completed]
  schedule:
    - cron: '43 5 * * 1' # Mondays, 05:43 UTC

permissions:
  contents: write

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    env:
      URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Where the live site is, and whether it's new
        run: |
          sleep 20 # let the Pages CDN pick up a fresh deploy
          # Use the first address that serves the site (the new domain, then the old one while DNS moves).
          # A domain only counts if it serves this site (the home page carries its build stamp, data-built), not a redirect elsewhere.
          if [ -z "$URL" ]; then
            for u in https://craigsworks.com/ https://craga89.github.io/craigsworks/; do
              final=$(curl -sfL -m 20 -o page.html -w '%{url_effective}' "$u" || true)
              if grep -q "data-built=" page.html 2>/dev/null; then URL="$final"; break; fi
              echo "::warning title=Lighthouse::$u isn't serving this site yet (ended up at ${final:-no response})"
            done
          else
            curl -sfL -m 20 -o page.html "$URL" || true
          fi
          [ -n "$URL" ] || { echo "::error::No address is serving the site"; exit 1; }
          echo "URL=$URL" >> "$GITHUB_ENV"
          # The commit the live site was built from, and the one last audited.
          live="$(grep -o 'data-commit="[0-9a-f]*"' page.html | head -1 | cut -d'"' -f2 || true)"
          echo "LIVE_COMMIT=${live:-unknown}" >> "$GITHUB_ENV"
          last=""
          if git fetch -q --depth=1 origin lighthouse 2>/dev/null; then last="$(git show FETCH_HEAD:reports/commit.txt 2>/dev/null || true)"; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ -n "$live" ] && [ "$live" = "$last" ]; then
            echo "::notice title=Lighthouse::The live site (${live:0:7}) was already audited; nothing to do"
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "::notice title=Lighthouse::Auditing $URL (${live:0:7})"
          fi
      - if: env.SKIP != '1'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: env.SKIP != '1'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install Lighthouse
        if: env.SKIP != '1'
        # Into its own folder (not the project), and onto the PATH for the audit.
        run: |
          mkdir -p "$RUNNER_TEMP/lighthouse" && cd "$RUNNER_TEMP/lighthouse"
          echo '{"private":true}' > package.json
          pnpm add lighthouse@13 --config.strict-dep-builds=false > /dev/null
          echo "$RUNNER_TEMP/lighthouse/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Audit
        if: env.SKIP != '1'
        run: |
          mkdir -p out
          # SEO is only checked once the site is open to search engines.
          if curl -sf -m 20 "${URL%/}/robots.txt" | grep -qx 'Disallow: /'; then echo "INDEXED=0" >> "$GITHUB_ENV"; else echo "INDEXED=1" >> "$GITHUB_ENV"; fi
          for preset in mobile desktop; do
            for i in 1 2 3; do
              flags=""; [ "$preset" = desktop ] && flags="--preset=desktop"
              lighthouse "$URL" $flags --quiet --output=json --output-path="out/$preset-$i.json" \
                --chrome-flags="--headless=new --no-sandbox" 2> "out/$preset-$i.log" \
                || echo "::warning title=Lighthouse $preset run $i::$(tail -c 600 "out/$preset-$i.log" | tr '\n' ' ')"
            done
          done
          if ! node tools/lighthouse-summary.mjs out > out/summary.json 2> out/summary.err; then
            echo "::error title=Lighthouse summary::$(tail -c 800 out/summary.err | tr '\n' ' ')"; exit 1
          fi
          head -c 4000 out/summary.json
      - name: Prepare the report
        if: env.SKIP != '1'
        run: |
          mkdir -p report/reports && cp out/summary.json report/reports/summary.json
          for f in out/mobile-2.json out/desktop-2.json; do [ -f "$f" ] && cp "$f" report/reports/; done
          echo "$LIVE_COMMIT" > report/reports/commit.txt
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > report/reports/run.txt
          date -u +%FT%TZ > report/reports/at.txt
      - if: env.SKIP != '1'
        uses: ./.github/actions/publish-branch
        with:
          branch: lighthouse
          source: report
          message: Lighthouse for ${{ env.LIVE_COMMIT }}
      - name: Check thresholds
        if: env.SKIP != '1'
        # Fails the run if a score drops: performance under 95, or accessibility / best practices
        # under 100. SEO is only checked once the site is open to search engines (no noindex).
        run: |
          node -e '
            const s = require("./out/summary.json");
            const indexed = process.env.INDEXED === "1";
            const min = { performance: 95, accessibility: 100, "best-practices": 100, ...(indexed ? { seo: 100 } : {}) };
            let bad = 0;
            for (const preset of ["mobile", "desktop"]) {
              const sc = (s[preset] || {}).scores || {};
              for (const [k, v] of Object.entries(min)) {
                if (sc[k] == null || sc[k] < v) { bad++; console.log(`::error title=Lighthouse ${preset}::${k} ${sc[k]} (needs ${v})`); }
                else console.log(`${preset} ${k}: ${sc[k]}`);
              }
            }
            process.exit(bad ? 1 : 0);
          '
