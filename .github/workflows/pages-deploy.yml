# Publishes the `pages` branch (the live site at the root, staging previews under staging/) to
# GitHub Pages. Called by CI after a build of the default branch passes its checks, and by
# staging-deploy.yml straight after a staging preview is stored.
#
# One deploy at a time: a deploy that's waiting is replaced by a newer one, which is fine because
# each publishes whatever the branch holds by then.
name: Deploy to GitHub Pages

on:
  workflow_call:
    outputs:
      page_url:
        description: Where Pages serves the site
        value: ${{ jobs.deploy.outputs.page_url }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages
          path: pages
          persist-credentials: false
      # Until the live site has been stored once, publishing would take it down: wait for that.
      - name: Is the live site there?
        id: ready
        run: |
          if [ -f pages/index.html ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning title=Pages::The pages branch has no live site yet, so nothing was deployed. The next deploy from the default branch will publish it."; fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages
      - id: deployment
        if: steps.ready.outputs.ok == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
