# Publishes the pages branch as soon as preview.yml has stored a preview, then marks the commit's
# "Preview" status live (its Details link opens the preview).
#
# This is its own workflow, started when Preview finishes, because it then runs from the default
# branch, the only branch the github-pages environment lets deploy.
name: Preview deploy

on:
  workflow_run:
    workflows: [Preview]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    uses: Craga89/standards/.github/workflows/pages-deploy.yml@2683e4116e18f128c46fce9261c4bd5d1284e8ff # v1
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
