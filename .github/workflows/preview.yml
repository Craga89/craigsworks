# Branch previews on Cloudflare: every push to a branch is built straight away (no waiting for the
# checks) and served as a Worker Preview of its own, at
# https://<branch>-<hash>-craigsworks.craga89.workers.dev/. The commit gets a "Preview" status
# linking to it and the branch's pull request one comment; deleting the branch deletes the Preview.
# See Craga89/standards guidelines/hosting.md.
#
# The live site is only ever updated by CI, after every check passes.
name: Preview

on:
  push:
    branches-ignore:
      - master # the live site (CI deploys it once every check passes)
      - pages # GitHub Pages' old branch, until it's deleted
      - accessibility # report branches
      - lighthouse
      - 'bootstrap/**' # dependency and font bootstraps
      - 'dependabot/**' # Dependabot's runs get no secrets
  pull_request:
    types: [opened, reopened] # comments the link on a branch pushed before its pull request
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per branch, so a newer push (or deleting the branch) replaces a run that hasn't finished. Pull
  # request events only comment, so they get a group of their own and never cancel a build.
  group: preview-${{ github.event_name == 'pull_request' && 'pr-' || '' }}${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  preview:
    # Deleting a tag has no Preview to remove; Dependabot's, bootstrap and forks' pull requests get
    # none.
    if: >-
      (github.event_name != 'delete' || github.event.ref_type == 'branch') &&
      (github.event_name != 'pull_request' ||
        (!startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'bootstrap/') &&
         github.event.pull_request.head.repo.full_name == github.repository))
    uses: Craga89/standards/.github/workflows/cloudflare-preview.yml@ed7edea1970776e239f2b6635dd9d64d9886089f # v1
    permissions:
      contents: read
      statuses: write # the "Preview" status on the commit
      pull-requests: write # the comment with the link
    with:
      worker: craigsworks # the "name" in cloudflare/wrangler.jsonc
      workers-subdomain: craga89
      config: cloudflare/wrangler.jsonc
      headers: cloudflare/_headers
      check-command: tools/cloudflare-check.sh "$PREVIEW_URL" preview
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
