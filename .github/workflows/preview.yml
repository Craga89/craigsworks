# Branch previews: every push to a branch is built straight away (no waiting for the checks) and
# stored under preview/<branch>-<hash>/ on the pages branch; preview-deploy.yml then publishes it,
# at https://<where Pages serves the site>/preview/<branch>-<hash>/, with a list of all of them at
# /preview/. The commit gets a "Preview" status linking to it, and the branch's pull request one
# comment. Deleting a branch removes its preview. See Craga89/standards docs/guidelines/previews.md.
#
# The live site is only ever updated by CI, after every check passes.
name: Preview

on:
  push:
    branches-ignore:
      - pages # what Pages serves (written by the workflows)
      - accessibility # report branches
      - lighthouse
      - 'bootstrap/**' # dependency and font bootstraps
      - 'dependabot/**' # Dependabot's token can't write the pages branch
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per branch, so a newer push (or deleting the branch) replaces a run that hasn't finished.
  group: preview-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    # Deleting a tag has no preview to remove.
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    uses: Craga89/standards/.github/workflows/preview.yml@0c41b52a17c2687d2fe3c3b95f838b653a4e4e1b # v1
    permissions:
      contents: write # the pages branch
      pages: read # where Pages serves the site
      statuses: write # the "Preview" status on the commit
      pull-requests: write # the comment with the link
