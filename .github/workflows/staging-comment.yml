# When a pull request is opened, comments its staging preview link (once; see
# .github/actions/preview-comment). Previews pushed while a pull request is open get the comment
# from staging-deploy.yml instead; this covers a branch pushed before its pull request existed.
name: Staging preview comment

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  comment:
    name: Comment the preview link
    # Only branches of this repository get previews (forks can't push to it).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
      pull-requests: write
    concurrency:
      group: preview-comment-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/preview-comment
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          pr: ${{ github.event.pull_request.number }}
