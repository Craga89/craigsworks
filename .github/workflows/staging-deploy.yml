# Publishes a staging preview as soon as staging.yml has stored it, then links it from the commit
# (a "Staging preview" status, so it shows in the pull request's checks, with the address in its
# description and behind its Details link) and, once, in a comment on the branch's pull request.
#
# This is its own workflow, started when Staging finishes, because it then runs from the default
# branch, the only branch the github-pages environment lets deploy.
name: Staging deploy

on:
  workflow_run:
    workflows: [Staging]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/pages-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  status:
    name: Link the preview
    needs: deploy
    if: github.event.workflow_run.event == 'push' && needs.deploy.outputs.page_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    # One at a time per branch, so this and staging-comment.yml can't both post the comment.
    concurrency:
      group: preview-comment-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: link
        uses: ./.github/actions/preview-comment
        with:
          branch: ${{ github.event.workflow_run.head_branch }}
          page-url: ${{ needs.deploy.outputs.page_url }}
      # The commit's "Staging preview" status: its Details link opens the preview, and the
      # address is in its description too.
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ steps.link.outputs.url }}
        run: |
          desc="Live at $URL"; [ ${#desc} -le 140 ] || desc="Live: open Details for the preview"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context="Staging preview" \
            -f description="$desc" -f target_url="$URL" > /dev/null
          echo "::notice title=Staging preview::$URL"
          echo "Staging preview: $URL" >> "$GITHUB_STEP_SUMMARY"
