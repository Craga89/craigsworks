# Staging previews: every push to a branch is built straight away (no waiting for the checks) and
# stored under staging/<branch>/ on the pages branch; staging-deploy.yml then publishes it, at
#   https://<where Pages serves the site>/staging/<branch>/
# with a list of all of them at /staging/. Deleting a branch removes its preview.
#
# The live site is only ever updated by CI, after every check passes.
name: Staging

on:
  push:
    branches-ignore:
      - pages # what Pages serves (written by the workflows)
      - accessibility # report branches
      - lighthouse
      - 'bootstrap/**' # dependency and font bootstraps
      - 'dependabot/**' # Dependabot's token can't write the pages branch
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per branch, so a newer push (or deleting the branch) replaces a run that hasn't finished.
  group: staging-${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  where:
    name: Preview folder
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.slug.outputs.branch }}
      slug: ${{ steps.slug.outputs.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: slug
        env:
          # On a delete the workflow runs on the default branch; the deleted one is in event.ref.
          BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
        run: |
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "slug=$(node tools/staging-index.mjs slug "$BRANCH")" >> "$GITHUB_OUTPUT"

  build:
    needs: where
    if: github.event_name != 'delete'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      pages: read
    with:
      subpath: staging/${{ needs.where.outputs.slug }}/
      staging: ${{ needs.where.outputs.branch }}

  store:
    name: Store the preview
    needs: [where, build]
    # Not always(): a newer push (or deleting the branch) cancels this run, and then nothing may be
    # stored, or an older build could overwrite a newer preview or bring back a deleted one.
    if: ${{ !cancelled() && needs.where.result == 'success' && (github.event_name == 'delete' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name != 'delete'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: site
      - uses: ./.github/actions/pages-store
        with:
          target: staging/${{ needs.where.outputs.slug }}
          source: site
          remove: ${{ github.event_name == 'delete' }}
          branch: ${{ needs.where.outputs.branch }}
          sha: ${{ github.sha }}
      - name: Summary
        if: github.event_name != 'delete'
        env:
          BASE: ${{ needs.build.outputs.base }}
        run: |
          echo "Preview, live in a minute or two once Staging deploy finishes: \`$BASE\`" >> "$GITHUB_STEP_SUMMARY"
