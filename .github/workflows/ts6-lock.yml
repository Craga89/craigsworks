# Temporary: regenerates the lockfile for PR #27 with TypeScript kept at 6 (astro check doesn't
# support 7 yet). Uploads package.json and pnpm-lock.yaml as an artifact; delete this branch after.
name: TypeScript 6 lockfile
on:
  push:
    branches: ['deps/ts6-lock']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: Craga89/standards/github/actions/setup-node@b8f7b51e18400dff89a9fcb8f296334c5e269e38 # v1
      - run: |
          sed -i 's/"typescript": "7.0.2"/"typescript": "6.0.3"/' package.json
          pnpm add -D --save-exact @emnapi/runtime@1.11.3
          grep -n "emnapi/runtime@2" pnpm-lock.yaml | head -20 || true
          pnpm run typecheck
          pnpm run build
      - run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b deps/ts6-lock-out
          git add package.json pnpm-lock.yaml
          git commit -m "lockfile"
          git push -f origin deps/ts6-lock-out
